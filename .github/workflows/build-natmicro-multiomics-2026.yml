name: Package Nature Microbiology multi-omics review (text and publisher links)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-natmicro-multiomics-2026.yml'
      - 'articles/NatureMicrobiology-MultiOmics-Integration-2026/article.md'
      - 'articles/NatureMicrobiology-MultiOmics-Integration-2026/README.md'
      - 'articles/NatureMicrobiology-MultiOmics-Integration-2026/figure_manifest.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Markdown validator
        run: python -m pip install markdown-it-py
      - name: Validate all bold Markdown and source figure links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from markdown_it import MarkdownIt
          import re
          d=Path("articles/NatureMicrobiology-MultiOmics-Integration-2026")
          article=(d/"article.md").read_text(encoding="utf-8")
          bold=list(re.finditer(r"\*\*([^\n]+?)\*\*",article))
          wrongly_adjacent=[
              m for m in bold
              if re.search(r"[\w]",article[m.start()-1:m.start()])
              or re.search(r"[\w]",article[m.end():m.end()+1])
          ]
          assert not wrongly_adjacent,"Unsafe bold adjacent to Chinese or Latin words"
          html=MarkdownIt().render(article)
          print("Markdown bold count",len(bold),"rendered",html.count("<strong>"))
          assert html.count("<strong>")==len(bold)
          assert len(bold)>30
          for i in range(1,7):
              url=f"41564_2026_2328_Fig{i}_HTML.png"
              assert article.count(url)==1,("Missing or duplicate figure reference",url)
          assert not (d/"images").exists(),"Do not republish proprietary figure assets"
          print("PASS: six publisher figure links, Markdown formatting; no copied figures.")
          PY
      - name: Archive text-only article and figure manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          zipfile='downloads/NatureMicrobiology-MultiOmics-Integration-2026.zip'
          rm -f "$zipfile"
          zip -r "$zipfile" articles/NatureMicrobiology-MultiOmics-Integration-2026 -x '*/.DS_Store'
          unzip -t "$zipfile"
      - name: Commit verified public archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/NatureMicrobiology-MultiOmics-Integration-2026.zip
          if git diff --cached --quiet; then
            echo 'No archive changes'
          else
            git commit -m 'Package Nature Microbiology multi-omics review as text and source links'
            git push
          fi
