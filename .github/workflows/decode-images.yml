name: Decode article images

on:
  push:
    paths:
      - '.assets_b64/**'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode PNG assets
        shell: bash
        run: |
          mkdir -p images
          shopt -s nullglob
          for f in .assets_b64/*.b64; do
            name="$(basename "$f" .b64)"
            base64 --decode "$f" > "images/$name"
          done
      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Decode article figures"
          git push
