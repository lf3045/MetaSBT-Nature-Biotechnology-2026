name: Package Nature Genetics fungal genomics Perspective

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-natgenet-fungal-genomics-2026.yml'
      - 'articles/NatureGenetics-Fungal-Genomics-LongRead-2026/article.md'
      - 'articles/NatureGenetics-Fungal-Genomics-LongRead-2026/README.md'
      - 'articles/NatureGenetics-Fungal-Genomics-LongRead-2026/figure_manifest.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Markdown parser
        run: python -m pip install markdown-it-py

      - name: Validate Chinese Markdown emphasis and five publisher figure links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from markdown_it import MarkdownIt
          import re
          d=Path('articles/NatureGenetics-Fungal-Genomics-LongRead-2026')
          content=(d/'article.md').read_text(encoding='utf-8')
          b=list(re.finditer(r'\*\*([^\n]+?)\*\*',content))
          bad=[]
          for m in b:
              left=content[m.start()-1:m.start()]
              right=content[m.end():m.end()+1]
              if re.search(r'[\w]',left) or re.search(r'[\w]',right):
                  bad.append(m.group())
          assert not bad,('Chinese-adjacent emphasis',bad[:5])
          strong=MarkdownIt().render(content).count('<strong>')
          assert len(b)==55 and strong==len(b),(len(b),strong)
          for n in range(1,6):
              fragment=f'https://www.nature.com/articles/s41588-026-02790-w/figures/{n}'
              assert content.count(fragment)==1,(n,content.count(fragment))
          assert not (d/'images').exists(),'Publisher images should not be copied into a public repository'
          assert '22,799' in content and '4,563' in content and '18,236' in content
          print('PASS: All 55 bold spans render; all 5 publisher figure links present; no images redistributed')
          PY
      - name: Create public text ZIP and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          zipfile='downloads/NatureGenetics-Fungal-Genomics-LongRead-2026.zip'
          rm -f "$zipfile"
          zip -r "$zipfile" articles/NatureGenetics-Fungal-Genomics-LongRead-2026 -x '*/.DS_Store'
          unzip -t "$zipfile"
      - name: Publish public archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/NatureGenetics-Fungal-Genomics-LongRead-2026.zip
          if git diff --cached --quiet; then
              echo 'No changes'
          else
              git commit -m 'Package Nature Genetics fungal genomics analysis and verified Markdown'
              git push
          fi
