name: Download article figures

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download figures from Nature
        shell: bash
        run: |
          mkdir -p images
          curl -L --fail --retry 3 -o images/fig01_metasbt_framework.png 'https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41587-026-03245-7/MediaObjects/41587_2026_3245_Fig1_HTML.png'
          curl -L --fail --retry 3 -o images/fig02_species_clusters.png 'https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41587-026-03245-7/MediaObjects/41587_2026_3245_Fig2_HTML.png'
          curl -L --fail --retry 3 -o images/fig03_novel_viral_species.png 'https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41587-026-03245-7/MediaObjects/41587_2026_3245_Fig3_HTML.png'
          curl -L --fail --retry 3 -o images/fig04_scalability.png 'https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41587-026-03245-7/MediaObjects/41587_2026_3245_Fig4_HTML.png'
          curl -L --fail --retry 3 -o images/fig05_microbiome_profile.png 'https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41587-026-03245-7/MediaObjects/41587_2026_3245_Fig5_HTML.png'
      - name: Commit figures
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Nature Biotechnology figures'
          git push
