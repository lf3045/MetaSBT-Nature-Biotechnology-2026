name: Generate local Markdown

on:
  push:
    branches: [main]
    paths:
      - 'article.md'
      - '.github/workflows/generate-local-markdown.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate relative-path version
        shell: bash
        run: |
          sed 's#https://raw.githubusercontent.com/lf3045/MetaSBT-Nature-Biotechnology-2026/main/images/#images/#g' article.md > article_local.md
      - name: Commit local Markdown
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add article_local.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Generate local Markdown version'
          git push
